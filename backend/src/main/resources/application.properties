# ---- Backend configuration ----
server.port=8081
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# ---- Merge Gateway (AI API router) ----
merge.gateway.base-url=https://api-gateway.merge.dev/v1/openai
merge.gateway.model=google/gemini-3-flash-preview
merge.gateway.max-tokens=3000

# ---- Anthropic Claude API (secondary path) ----
anthropic.model=claude-sonnet-4-6
anthropic.base-url=https://api.anthropic.com
anthropic.max-tokens=3000

# ---- CORS ----
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
